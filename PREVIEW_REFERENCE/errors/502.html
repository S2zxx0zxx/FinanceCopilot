<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>FinCopilot is restarting…</title>
  <style>
    body { background: #0A0F0D; color: rgba(255,255,255,0.92); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
    .card { max-width: 480px; text-align: center; }
    .mark { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #34D399, #C9A86A); display: inline-flex; align-items: center; justify-content: center; color: #0A0F0D; font-weight: 800; font-size: 28px; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
    p { color: #9BA8A2; font-size: 15px; line-height: 1.6; margin: 0 0 24px; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #34D399; animation: pulse 1.4s ease-in-out infinite; margin: 0 4px; vertical-align: middle; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">₵</div>
    <h1>FinCopilot is restarting</h1>
    <p>The service is deploying<span class="dot"></span><span class="dot"></span><span class="dot"></span>back in a moment.</p>
  </main>
  <script>setTimeout(() => location.reload(), 3000);</script>
</body>
</html>
