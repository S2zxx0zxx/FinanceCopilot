name: FinCopilot Foundation Rebrand

on:
  push:
    branches:
      - feat/securo-foundation-migration
    paths:
      - .github/workflows/securo-foundation-migration.yml

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/securo-foundation-migration
          fetch-depth: 0

      - name: Finalize imported foundation branding
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_LANDING_TREE="abc2a077f1fbb9ce82e1dbde86cc10c1c3e973fe"
          test "$(git rev-parse HEAD:fincopilot-landing)" = "$EXPECTED_LANDING_TREE"

          python3 scripts/fincopilot_rebrand.py
          python3 scripts/fincopilot_runtime_brand_fix.py

          remaining="$(grep -RIlE 'Securo|SECURO|securo' . \
            --exclude-dir=.git \
            --exclude-dir=fincopilot-landing \
            --exclude='LICENSE' \
            --exclude='UPSTREAM.md' \
            --exclude='FINCOPILOT_MIGRATION.md' \
            --exclude='fincopilot_rebrand.py' \
            --exclude='securo-foundation-migration.yml' || true)"
          if [ -n "$remaining" ]; then
            echo "::error::Old product branding remains in active text:"
            echo "$remaining"
            exit 1
          fi

          git diff --exit-code HEAD -- fincopilot-landing
          test "$(git rev-parse HEAD:fincopilot-landing)" = "$EXPECTED_LANDING_TREE"

          git add -A -- ':!.github/workflows/securo-foundation-migration.yml'
          git diff --cached --quiet -- fincopilot-landing

          if git diff --cached --quiet; then
            echo "No additional branding changes to commit."
            exit 0
          fi

          git config user.name "FinCopilot Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: normalize FinCopilot runtime branding"
          git push origin HEAD:feat/securo-foundation-migration
