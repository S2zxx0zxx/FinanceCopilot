name: Securo Foundation Migration

on:
  push:
    branches:
      - feat/securo-foundation-migration
    paths:
      - .github/workflows/securo-foundation-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout FinCo-Pilot migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/securo-foundation-migration
          fetch-depth: 0

      - name: Import pinned Securo foundation without touching landing page
        shell: bash
        env:
          UPSTREAM_REPO: https://github.com/securo-finance/securo.git
          UPSTREAM_COMMIT: 2869ff40cbf56da7d0d07aba602c52617a71f137
        run: |
          set -euo pipefail

          BEFORE_LANDING_TREE="$(git rev-parse HEAD:fincopilot-landing)"
          echo "Landing tree before migration: ${BEFORE_LANDING_TREE}"

          UPSTREAM_DIR="${RUNNER_TEMP}/securo-upstream"
          WORKFLOW_BACKUP="${RUNNER_TEMP}/fincopilot-workflows"
          rm -rf "${UPSTREAM_DIR}" "${WORKFLOW_BACKUP}"

          # Preserve the branch's current workflow directory so the Actions
          # token does not need workflow-write permission for the bulk push.
          mkdir -p "${WORKFLOW_BACKUP}"
          cp -a .github/workflows/. "${WORKFLOW_BACKUP}/"

          git init "${UPSTREAM_DIR}"
          git -C "${UPSTREAM_DIR}" remote add origin "${UPSTREAM_REPO}"
          git -C "${UPSTREAM_DIR}" fetch --depth=1 origin "${UPSTREAM_COMMIT}"
          git -C "${UPSTREAM_DIR}" checkout --detach FETCH_HEAD

          RESOLVED_UPSTREAM="$(git -C "${UPSTREAM_DIR}" rev-parse HEAD)"
          test "${RESOLVED_UPSTREAM}" = "${UPSTREAM_COMMIT}"

          # Replace the application foundation while preserving .git and the
          # existing FinCo-Pilot landing page exactly as requested.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'fincopilot-landing' \
            -exec rm -rf {} +

          # Import every upstream file except Git metadata and workflows.
          # Workflows are added separately after this bulk commit succeeds.
          rsync -a \
            --exclude='.git' \
            --exclude='.github/workflows/***' \
            "${UPSTREAM_DIR}/" ./

          mkdir -p .github/workflows
          cp -a "${WORKFLOW_BACKUP}/." .github/workflows/

          # Landing must remain untouched.
          git diff --exit-code HEAD -- fincopilot-landing

          cat > UPSTREAM.md <<'EOF'
          # Upstream foundation

          FinCo-Pilot contains a modified downstream version of Securo.

          - Upstream project: https://github.com/securo-finance/securo
          - Imported commit: `2869ff40cbf56da7d0d07aba602c52617a71f137`
          - Upstream license: GNU Affero General Public License v3.0 (AGPL-3.0)
          - Product branding and subsequent FinCo-Pilot-specific changes are maintained in this repository.

          The upstream `LICENSE` file is retained. Required copyright and license notices must not be removed when modifying or redistributing the covered code.
          EOF

          cat > FINCOPILOT_MIGRATION.md <<'EOF'
          # FinCo-Pilot foundation migration

          This branch imports the complete Securo source tree from the pinned upstream commit while preserving `fincopilot-landing/` from the pre-migration FinCo-Pilot commit.

          ## Invariants

          1. `fincopilot-landing/` remains untouched unless an explicit landing-page change is requested.
          2. Securo functionality is the baseline: backend, frontend app, migrations, providers, agents, MCP, tests, docs, deployment and CI are imported together rather than cherry-picked.
          3. AGPL-3.0 and legally required upstream notices are preserved. Product branding may be replaced with FinCo-Pilot branding, but required attribution is not stripped.
          4. FinCo-Pilot-specific features are layered on top without silently deleting upstream capabilities.
          EOF

          git add -A
          git diff --cached --quiet -- fincopilot-landing
          test "$(git rev-parse HEAD:fincopilot-landing)" = "${BEFORE_LANDING_TREE}"

          if git diff --cached --quiet; then
            echo "Nothing to migrate."
            exit 0
          fi

          git config user.name "FinCo-Pilot Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: import complete Securo foundation at ${UPSTREAM_COMMIT}"
          git push origin HEAD:feat/securo-foundation-migration
