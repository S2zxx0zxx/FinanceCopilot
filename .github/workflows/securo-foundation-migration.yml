name: FinCopilot Foundation Rebrand

on:
  push:
    branches:
      - feat/securo-foundation-migration
    paths:
      - .github/workflows/securo-foundation-migration.yml

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/securo-foundation-migration
          fetch-depth: 0

      - name: Rebrand imported application while protecting landing and license
        shell: bash
        run: |
          set -euo pipefail

          LANDING_TREE="$(git rev-parse HEAD:fincopilot-landing)"
          EXPECTED_LANDING_TREE="abc2a077f1fbb9ce82e1dbde86cc10c1c3e973fe"
          test "$LANDING_TREE" = "$EXPECTED_LANDING_TREE"

          python3 <<'PY'
          from pathlib import Path
          import os, re, struct, zlib

          root = Path('.')
          protected_roots = {'.git', 'fincopilot-landing'}
          protected_files = {
              Path('LICENSE'), Path('UPSTREAM.md'), Path('FINCOPILOT_MIGRATION.md'),
          }

          # Ordered: specific URLs/identifiers first, then product casing.
          replacements = [
              ('https://docs.usesecuro.com/', 'https://github.com/S2zxx0zxx/FinanceCopilot/tree/main/docs/'),
              ('https://demo.usesecuro.com/', 'https://github.com/S2zxx0zxx/FinanceCopilot'),
              ('https://www.usesecuro.com/roadmap', 'https://github.com/S2zxx0zxx/FinanceCopilot'),
              ('https://www.usesecuro.com/', 'https://github.com/S2zxx0zxx/FinanceCopilot'),
              ('https://usesecuro.com/install.sh', 'https://raw.githubusercontent.com/S2zxx0zxx/FinanceCopilot/main/install.sh'),
              ('https://usesecuro.com/', 'https://github.com/S2zxx0zxx/FinanceCopilot/'),
              ('https://github.com/securo-finance/securo.git', 'https://github.com/S2zxx0zxx/FinanceCopilot.git'),
              ('https://github.com/securo-finance/securo', 'https://github.com/S2zxx0zxx/FinanceCopilot'),
              ('github.com/securo-finance/securo', 'github.com/S2zxx0zxx/FinanceCopilot'),
              ('securo-finance/securo', 'S2zxx0zxx/FinanceCopilot'),
              ('ghcr.io/securo-finance/securo-', 'ghcr.io/S2zxx0zxx/fincopilot-'),
              ('Securo Finance', 'FinCopilot'),
              ('Securo', 'FinCopilot'),
              ('SECURO', 'FINCOPILOT'),
              ('securo', 'fincopilot'),
          ]

          binary_ext = {
              '.png','.jpg','.jpeg','.gif','.ico','.webp','.woff','.woff2','.ttf','.otf',
              '.pdf','.zip','.gz','.tgz','.tar','.db','.sqlite','.pyc'
          }

          changed = []
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              rel = p.relative_to(root)
              if rel in protected_files:
                  continue
              if rel.parts and rel.parts[0] in protected_roots:
                  continue
              if rel.parts[:2] == ('.github','workflows'):
                  continue
              if p.suffix.lower() in binary_ext:
                  continue
              try:
                  raw = p.read_bytes()
                  if b'\x00' in raw:
                      continue
                  text = raw.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = text
              for old, rep in replacements:
                  new = new.replace(old, rep)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(rel))

          # Rename any imported path that still carries the old product slug.
          candidates = []
          for p in root.rglob('*'):
              rel = p.relative_to(root)
              if not rel.parts or rel.parts[0] in protected_roots:
                  continue
              if rel.parts[:2] == ('.github','workflows'):
                  continue
              if 'securo' in p.name.lower():
                  candidates.append(p)
          for p in sorted(candidates, key=lambda x: len(x.parts), reverse=True):
              if not p.exists():
                  continue
              name = p.name.replace('Securo','FinCopilot').replace('SECURO','FINCOPILOT').replace('securo','fincopilot')
              if name != p.name:
                  target = p.with_name(name)
                  if target.exists():
                      continue
                  p.rename(target)

          # FinCopilot brand assets: custom icon aligned with the existing landing
          # (green/gold finance mark), replacing imported upstream favicons.
          icon_svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45e6a8"/><stop offset="1" stop-color="#d6b85c"/></linearGradient></defs><rect width="128" height="128" rx="30" fill="#0a0f0d"/><rect x="8" y="8" width="112" height="112" rx="24" fill="url(#g)"/><text x="64" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="68" fill="#0a0f0d">₵</text></svg>'''
          wordmark_svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45e6a8"/><stop offset="1" stop-color="#d6b85c"/></linearGradient></defs><rect x="4" y="4" width="92" height="92" rx="22" fill="url(#g)"/><text x="50" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="52" fill="#0a0f0d">₵</text><text x="116" y="64" font-family="Arial,sans-serif" font-weight="700" font-size="43" fill="#eaf5ef">FinCopilot</text></svg>'''
          Path('frontend/public').mkdir(parents=True, exist_ok=True)
          Path('favicons').mkdir(parents=True, exist_ok=True)
          Path('docs').mkdir(parents=True, exist_ok=True)
          Path('frontend/public/favicon.svg').write_text(icon_svg, encoding='utf-8')
          Path('favicons/favicon.svg').write_text(icon_svg, encoding='utf-8')
          Path('docs/logo.svg').write_text(wordmark_svg, encoding='utf-8')

          def png_bytes(size):
              rows=[]
              for y in range(size):
                  row=bytearray([0])
                  for x in range(size):
                      # rounded-ish green/gold gradient tile
                      t=(x+y)/(2*max(1,size-1))
                      r=int(69*(1-t)+214*t); g=int(230*(1-t)+184*t); b=int(168*(1-t)+92*t)
                      # stylized dark C ring in the middle
                      cx=cy=(size-1)/2; dx=(x-cx)/(size*0.32); dy=(y-cy)/(size*0.32)
                      d=(dx*dx+dy*dy)**0.5
                      ring=0.58<d<0.95 and not (dx>0.18 and abs(dy)<0.48)
                      if ring: r,g,b=10,15,13
                      row.extend((r,g,b,255))
                  rows.append(bytes(row))
              raw=b''.join(rows)
              def chunk(tag,data):
                  return struct.pack('>I',len(data))+tag+data+struct.pack('>I',zlib.crc32(tag+data)&0xffffffff)
              return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')

          def size_for(name):
              m=re.search(r'(\d+)x(\d+)',name)
              if m: return int(m.group(1))
              if 'apple-touch' in name: return 180
              if name=='favicon.png': return 96
              return 32

          targets=[]
          for base in (Path('favicons'), Path('frontend/public')):
              for p in base.glob('*.png'):
                  targets.append(p)
          # Guarantee the canonical assets even if a source file was absent.
          for n in ('favicon-16x16.png','favicon-32x32.png','favicon-96x96.png','apple-touch-icon.png','android-icon-192x192.png'):
              targets.append(Path('frontend/public')/n)
          seen=set()
          for p in targets:
              if p in seen: continue
              seen.add(p); p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(png_bytes(size_for(p.name)))

          # ICO with an embedded 32px PNG.
          p32=png_bytes(32)
          ico=struct.pack('<HHH',0,1,1)+struct.pack('<BBBBHHII',32,32,0,0,1,32,len(p32),22)+p32
          Path('frontend/public/favicon.ico').write_bytes(ico)
          Path('favicons/favicon.ico').write_bytes(ico)

          # Keep a machine-readable brand note for future contributors.
          Path('BRANDING.md').write_text('''# FinCopilot branding\n\nProduct name: **FinCopilot**  \nRepository slug: **FinanceCopilot**  \nInternal service/package slug: **fincopilot**\n\nThe protected `fincopilot-landing/` subtree is the canonical visual-brand reference and is not modified by the Securo foundation migration. Upstream licensing/provenance remains documented in `LICENSE` and `UPSTREAM.md`.\n''',encoding='utf-8')

          print(f'Rebranded {len(changed)} text files.')
          PY

          # Verify product branding is gone from active text outside the explicit
          # legal/provenance records and this temporary migration workflow.
          remaining="$(grep -RIlE 'Securo|SECURO|securo' . \
            --exclude-dir=.git \
            --exclude-dir=fincopilot-landing \
            --exclude='LICENSE' \
            --exclude='UPSTREAM.md' \
            --exclude='FINCOPILOT_MIGRATION.md' \
            --exclude='securo-foundation-migration.yml' || true)"
          if [ -n "$remaining" ]; then
            echo "::error::Old product branding remains in active text:"
            echo "$remaining"
            exit 1
          fi

          # Landing-page hard guard.
          git diff --exit-code HEAD -- fincopilot-landing
          test "$(git rev-parse HEAD:fincopilot-landing)" = "$EXPECTED_LANDING_TREE"

          git add -A -- ':!.github/workflows/securo-foundation-migration.yml'
          git diff --cached --quiet -- fincopilot-landing

          if git diff --cached --quiet; then
            echo "No rebrand changes to commit."
            exit 0
          fi

          git config user.name "FinCopilot Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "refactor: rebrand Securo foundation as FinCopilot"
          git push origin HEAD:feat/securo-foundation-migration
