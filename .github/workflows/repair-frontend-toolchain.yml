name: Repair Frontend Toolchain

on:
  push:
    branches:
      - feat/securo-foundation-migration
    paths:
      - .github/workflows/repair-frontend-toolchain.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: feat/securo-foundation-migration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate lockfile with supported TypeScript API
        working-directory: frontend
        run: npm install --save-dev --save-exact typescript@6.0.3 --package-lock-only --ignore-scripts

      - name: Commit generated package metadata
        run: |
          git config user.name "FinCopilot Automation"
          git config user.email "236218062+S2zxx0zxx@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No package metadata changes were required."
            exit 0
          fi
          git commit -m "fix(frontend): align TypeScript with eslint toolchain"
          git push origin HEAD:feat/securo-foundation-migration
