apiVersion: v2
name: fincopilot
description: A Helm chart for FinCopilot, an open-source personal finance application.
type: application
version: 0.15.1
appVersion: "0.15.1"
icon: https://raw.githubusercontent.com/S2zxx0zxx/FinanceCopilot/main/favicons/android-icon-192x192.png
home: https://github.com/S2zxx0zxx/FinanceCopilot
sources:
  - https://github.com/S2zxx0zxx/FinanceCopilot
keywords:
  - finance
  - accounting
  - fincopilot
annotations:
  # Artifact Hub only accepts ai-machine-learning, database,
  # integration-delivery, monitoring-logging, networking, security, storage or
  # streaming-messaging, and none of them describe a personal finance app. An
  # invalid value fails the whole package, and omitting the field entirely lets
  # Artifact Hub predict one from the keywords, which would be just as wrong,
  # so opt out of the prediction instead.
  artifacthub.io/category: skip-prediction
  artifacthub.io/license: "AGPL-3.0"
  artifacthub.io/images: |
    - name: fincopilot-backend
      image: ghcr.io/S2zxx0zxx/fincopilot-backend:latest
    - name: fincopilot-frontend
      image: ghcr.io/S2zxx0zxx/fincopilot-frontend:latest
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/S2zxx0zxx/FinanceCopilot
