<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinCopilot — Be right back</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0A0F0D;
      color: rgba(255,255,255,0.92);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #34D399, #C9A86A);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 800; color: #0A0F0D;
      margin: 0 auto 1.5rem;
    }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.75rem; letter-spacing: -0.02em; }
    p { color: #9BA8A2; font-size: 1.0625rem; line-height: 1.6; max-width: 34rem; }
    .badge {
      margin-top: 2rem;
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.3);
      border-radius: 999px; padding: 0.375rem 0.875rem;
      font-size: 0.8125rem; font-family: 'Geist Mono', monospace;
      color: #34D399;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #34D399; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    a { color: #34D399; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .retry { margin-top: 2.5rem; }
    .retry button {
      background: #34D399; color: #0A0F0D; border: none; cursor: pointer;
      padding: 0.625rem 1.5rem; border-radius: 10px; font-size: 0.875rem; font-weight: 600;
    }
    .retry button:hover { background: #6EE7B7; }
  </style>
</head>
<body>
  <div class="logo">₵</div>
  <h1>We'll be right back.</h1>
  <p>
    FinCopilot is temporarily unavailable. Our team has been notified and
    we're working to restore service. Usually less than 60 seconds.
  </p>
  <div class="badge">
    <span class="dot"></span>
    Status: Recovering
  </div>
  <div class="retry">
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
